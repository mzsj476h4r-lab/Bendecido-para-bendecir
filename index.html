let c=JSON.parse(localStorage.bpb_cart||'[]');
const products={'Avellanas':{p:50000,stock:5,img:AVELLANAS_IMG},'Frutos secos':{p:3000,stock:5,img:FRUTOS_IMG}};
const money=n=>'$'+Math.round(n).toLocaleString('es-AR');
function initProducts(){let saved=JSON.parse(localStorage.bpb_stock||'null');if(saved)Object.keys(products).forEach(k=>{if(saved[k]!=null)products[k].stock=+saved[k]});else saveStock();renderProducts()}
function saveStock(){localStorage.bpb_stock=JSON.stringify(Object.fromEntries(Object.entries(products).map(([k,v])=>[k,v.stock])))} 
function renderProducts(){document.querySelectorAll('.product').forEach(el=>{let n=el.dataset.product,p=products[n],s=el.querySelector('.stock'),btn=el.querySelector('button');if(s){s.textContent=p.stock>0?'Stock: '+p.stock.toFixed(2).replace('.',',')+' kg':'Sin stock';s.className='stock'+(p.stock<=0?' out':'')}if(btn)btn.disabled=p.stock<=0})}
function save(){localStorage.bpb_cart=JSON.stringify(c);render()}function add(n,p,s){let kg=+document.getElementById(s).value,prod=products[n],already=c.filter(i=>i.n==n).reduce((a,i)=>a+i.kg*i.q,0);if(already+kg>prod.stock+1e-9)return alert('No hay suficiente stock disponible.');let x=c.find(i=>i.n==n&&i.kg==kg);x?x.q++:c.push({n,kg,p,q:1});save()}function render(){let b=document.getElementById('cart'),t=0;if(!c.length){b.innerHTML='<p class="muted">Tu carrito está vacío 🌸</p>'}else b.innerHTML=c.map((x,i)=>{let z=x.kg*x.p*x.q;t+=z;return `<div class="item"><span>${x.n} · ${x.kg*1000} g × ${x.q}</span><span>${money(z)} <button onclick="c.splice(${i},1);save()">×</button></span></div>`}).join('');document.getElementById('total').textContent='Total: '+money(t)}
function addressBox(){document.getElementById('addr').classList.toggle('hidden',document.getElementById('delivery').value!='envio')}
function order(){if(!c.length)return alert('Agregá un producto.');let n=document.getElementById('name').value.trim(),ph=document.getElementById('phone').value.trim(),d=document.getElementById('delivery').value,ad=document.getElementById('address').value.trim();if(!n||!ph)return alert('Completá nombre y teléfono.');if(d=='envio'&&!ad)return alert('Completá la dirección.');let t=c.reduce((s,x)=>s+x.kg*x.p*x.q,0),o=JSON.parse(localStorage.bpb_orders||'[]');o.unshift({id:Date.now(),n,ph,d,ad,pay:document.getElementById('payment').value,items:c,total:t,status:'Pendiente',date:new Date().toLocaleString('es-AR')});localStorage.bpb_orders=JSON.stringify(o);c.forEach(x=>{if(products[x.n])products[x.n].stock=Math.max(0,products[x.n].stock-x.kg*x.q)});saveStock();c=[];save();renderProducts();document.getElementById('msg').textContent='✅ Pedido recibido. ¡Gracias por comprar!'}
function shop(){document.getElementById('shop').classList.remove('hidden');document.getElementById('admin').classList.add('hidden')}function panel(){document.getElementById('shop').classList.add('hidden');document.getElementById('admin').classList.remove('hidden')}
function login(){if(document.getElementById('pass').value!='bpb123')return alert('Contraseña incorrecta.');document.getElementById('adminin').classList.remove('hidden');renderStockInputs();renderOrders()}function renderStockInputs(){document.getElementById('stockA').value=products['Avellanas'].stock;document.getElementById('stockF').value=products['Frutos secos'].stock}
function updateStock(){products['Avellanas'].stock=Math.max(0,+document.getElementById('stockA').value||0);products['Frutos secos'].stock=Math.max(0,+document.getElementById('stockF').value||0);saveStock();renderProducts();document.getElementById('stockmsg').textContent='✅ Stock actualizado.'}
function renderOrders(){let o=JSON.parse(localStorage.bpb_orders||'[]');document.getElementById('orders').innerHTML=o.length?o.map((x,i)=>`<div class="order"><h3>Pedido #${String(x.id).slice(-5)} <span class="badge">${x.status}</span></h3><b>${x.n}</b> · ${x.ph}<p>${x.items.map(y=>`${y.n} · ${y.kg*1000} g × ${y.q}`).join('<br>')}</p><b>Total: ${money(x.total)}</b><p>Pago: ${x.pay}<br>${x.d=='envio'?'🛵 Envío · '+x.ad:'🏪 Retiro'}<br><small>${x.date}</small></p><select onchange="status(${i},this.value)"><option>Pending</option><option>Confirmado</option><option>Preparando</option><option>Listo</option><option>Entregado</option></select></div>`).join(''):'<p class="muted">Todavía no hay pedidos.</p>'}function status(i,v){let o=JSON.parse(localStorage.bpb_orders||'[]');o[i].status=v=='Pending'?'Pendiente':v;localStorage.bpb_orders=JSON.stringify(o);renderOrders()}initProducts();render();
</script></body></html>
