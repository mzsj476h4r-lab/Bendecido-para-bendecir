<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bendecido para bendecir</title><style>
:root{--g:#b9d8c1;--p:#f2c8d4;--bg:#f9f7f4;--d:#35443b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#e5f1e8,#fbe8ee);color:var(--d)}header{text-align:center;padding:28px 16px;background:#ffffffbb}h1{margin:0}.wrap{max-width:700px;margin:auto;padding:16px}.card{background:#fffdfd;border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:0 5px 18px #0000000d}h2{margin-top:0}.product{background:#e7f2e9;padding:15px;border-radius:16px;margin:10px 0}.producttop{display:flex;justify-content:space-between;gap:10px}.price{font-weight:bold}.controls{display:flex;gap:8px;margin-top:10px}select,input,button{font:inherit;border-radius:12px;padding:11px;border:1px solid #d6e0d8}select,input{width:100%;background:white}button{border:0;background:var(--p);font-weight:bold}button.green{background:var(--g)}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-weight:bold;margin:10px 0 5px}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}.total{text-align:right;font-size:21px;font-weight:bold;margin-top:12px}.hidden{display:none}.order{border:1px solid #eee;border-radius:15px;padding:13px;margin:10px 0}.badge{background:var(--p);padding:5px 9px;border-radius:20px;font-size:12px}.muted{color:#718078;text-align:center}footer{text-align:center;padding:20px;color:#718078}
@media(max-width:550px){.row{grid-template-columns:1fr}.producttop{display:block}}
</style></head><body>
<header><h1>🌿 Bendecido para bendecir 🌸</h1><p>Dietética · Productos naturales y saludables</p></header>
<div class="wrap"><div class="tabs"><button onclick="shop()">🛒 Comprar</button><button class="green" onclick="panel()">🔐 Mi panel</button></div>
<section id="shop">
<div class="card"><h2>🌸 Productos</h2>
<div class="product"><div class="producttop"><div><b>🌰 Avellanas</b><br><small>$50.000 por kg</small></div></div><div class="controls"><select id="a"><option value=".1">100 g</option><option value=".25">250 g</option><option value=".5">500 g</option><option value="1">1 kg</option></select><button onclick="add('Avellanas',50000,'a')">Agregar</button></div></div>
<div class="product"><div class="producttop"><div><b>🥜 Frutos secos</b><br><small>$3.000 por kg</small></div></div><div class="controls"><select id="f"><option value=".1">100 g</option><option value=".25">250 g</option><option value=".5">500 g</option><option value="1">1 kg</option></select><button onclick="add('Frutos secos',3000,'f')">Agregar</button></div></div></div>
<div class="card"><h2>🛍️ Carrito</h2><div id="cart"></div><div id="total" class="total">Total: $0</div></div>
<div class="card"><h2>📦 Datos del pedido</h2><label>Nombre y apellido</label><input id="name" placeholder="Ej. María González"><label>Teléfono</label><input id="phone" placeholder="Ej. 11 1234-5678"><label>Entrega</label><select id="delivery" onchange="addressBox()"><option value="retiro">🏪 Retiro</option><option value="envio">🛵 Envío</option></select><div id="addr" class="hidden"><label>Dirección</label><input id="address" placeholder="Calle y número"></div><label>Forma de pago</label><select id="payment"><option>Efectivo</option><option>Mercado Pago</option><option>Transferencia</option></select><button style="width:100%;margin-top:15px" onclick="order()">✅ Confirmar pedido</button><p id="msg" class="muted"></p></div></section>
<section id="admin" class="hidden"><div class="card"><h2>🔐 Panel privado</h2><input id="pass" type="password" placeholder="Contraseña"><button style="margin-top:10px" onclick="login()">Entrar</button><div id="adminin" class="hidden"><div id="orders"></div></div></div></section></div><footer>Bendecido para bendecir 🌿🌸</footer>
<script>
let c=JSON.parse(localStorage.bpb_cart||'[]');const money=n=>'$'+Math.round(n).toLocaleString('es-AR');
function save(){localStorage.bpb_cart=JSON.stringify(c);render()}function add(n,p,s){let kg=+document.getElementById(s).value,x=c.find(i=>i.n==n&&i.kg==kg);x?x.q++:c.push({n,kg,p,q:1});save()}function render(){let b=document.getElementById('cart'),t=0;if(!c.length){b.innerHTML='<p class="muted">Tu carrito está vacío 🌸</p>'}else b.innerHTML=c.map((x,i)=>{let z=x.kg*x.p*x.q;t+=z;return `<div class="item"><span>${x.n} · ${x.kg*1000} g × ${x.q}</span><span>${money(z)} <button onclick="c.splice(${i},1);save()">×</button></span></div>`}).join('');document.getElementById('total').textContent='Total: '+money(t)}
function addressBox(){document.getElementById('addr').classList.toggle('hidden',document.getElementById('delivery').value!='envio')}
function order(){if(!c.length)return alert('Agregá un producto.');let n=name.value.trim(),ph=phone.value.trim(),d=delivery.value,ad=address.value.trim();if(!n||!ph)return alert('Completá nombre y teléfono.');if(d=='envio'&&!ad)return alert('Completá la dirección.');let t=c.reduce((s,x)=>s+x.kg*x.p*x.q,0),o=JSON.parse(localStorage.bpb_orders||'[]');o.unshift({id:Date.now(),n,ph,d,ad,pay:payment.value,items:c,total:t,status:'Pendiente',date:new Date().toLocaleString('es-AR')});localStorage.bpb_orders=JSON.stringify(o);c=[];save();msg.textContent='✅ Pedido recibido. ¡Gracias por comprar!'}
function shop(){document.getElementById('shop').classList.remove('hidden');document.getElementById('admin').classList.add('hidden')}function panel(){document.getElementById('shop').classList.add('hidden');document.getElementById('admin').classList.remove('hidden')}
function login(){if(pass.value!='bpb123')return alert('Contraseña incorrecta.');adminin.classList.remove('hidden');renderOrders()}function renderOrders(){let o=JSON.parse(localStorage.bpb_orders||'[]');orders.innerHTML=o.length?o.map((x,i)=>`<div class="order"><h3>Pedido #${String(x.id).slice(-5)} <span class="badge">${x.status}</span></h3><b>${x.n}</b> · ${x.ph}<p>${x.items.map(y=>`${y.n} · ${y.kg*1000} g × ${y.q}`).join('<br>')}</p><b>Total: ${money(x.total)}</b><p>Pago: ${x.pay}<br>${x.d=='envio'?'🛵 Envío · '+x.ad:'🏪 Retiro'}<br><small>${x.date}</small></p><select onchange="status(${i},this.value)"><option>Pending</option><option>Confirmado</option><option>Preparando</option><option>Listo</option><option>Entregado</option></select></div>`).join(''):'<p class="muted">Todavía no hay pedidos.</p>'}function status(i,v){let o=JSON.parse(localStorage.bpb_orders||'[]');o[i].status=v=='Pending'?'Pendiente':v;localStorage.bpb_orders=JSON.stringify(o);renderOrders()}render();
</script></body></html>
